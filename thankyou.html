<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>제출 완료 · 배관119케어</title>
<meta name="robots" content="noindex">
<style>
  :root{
    --bg:#eef2f8;--surface:#ffffff;--ink:#0e1726;--muted:#54637b;--faint:#8592a6;
    --navy:#0b2144;--blue:#1461d1;--ok:#1aa251;--line:#e2e8f1;
    --shadow:0 20px 50px -20px rgba(11,33,68,.35);
    --sysface:"Pretendard","Pretendard Variable",-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Malgun Gothic","맑은 고딕",system-ui,sans-serif;
  }
  @media (prefers-color-scheme: dark){:root{--bg:#0a1626;--surface:#102039;--ink:#e9eff8;--muted:#a4b5cf;--faint:#6f83a3;--navy:#dbe7fb;--blue:#4c92ff;--line:#1f3355;--shadow:0 24px 60px -22px rgba(0,0,0,.7)}}
  :root[data-theme="dark"]{--bg:#0a1626;--surface:#102039;--ink:#e9eff8;--muted:#a4b5cf;--faint:#6f83a3;--navy:#dbe7fb;--blue:#4c92ff;--line:#1f3355;--shadow:0 24px 60px -22px rgba(0,0,0,.7)}
  :root[data-theme="light"]{--bg:#eef2f8;--surface:#ffffff;--ink:#0e1726;--muted:#54637b;--faint:#8592a6;--navy:#0b2144;--blue:#1461d1;--line:#e2e8f1;--shadow:0 20px 50px -20px rgba(11,33,68,.35)}
  *{margin:0;padding:0;box-sizing:border-box}
  body{font-family:var(--sysface);background:var(--bg);color:var(--ink);min-height:100vh;display:grid;place-items:center;padding:24px;letter-spacing:-.01em}
  .card{max-width:460px;width:100%;background:var(--surface);border:1px solid var(--line);border-radius:22px;box-shadow:var(--shadow);padding:44px 34px;text-align:center}
  .check{width:76px;height:76px;margin:0 auto 22px;border-radius:50%;background:color-mix(in srgb,var(--ok) 14%,transparent);display:grid;place-items:center}
  .check svg{width:40px;height:40px;color:var(--ok)}
  h1{font-size:1.5rem;font-weight:800;letter-spacing:-.03em;margin-bottom:12px;color:var(--ink)}
  p{color:var(--muted);font-size:1rem;line-height:1.65}
  .note{margin-top:22px;background:color-mix(in srgb,var(--blue) 8%,transparent);border:1px solid color-mix(in srgb,var(--blue) 22%,transparent);border-radius:14px;padding:15px 18px;font-size:.92rem;color:var(--ink);line-height:1.6}
  .note b{color:var(--blue)}
  a.back{display:inline-block;margin-top:24px;color:var(--blue);font-weight:700;font-size:.92rem;text-decoration:none;border:1px solid var(--line);padding:10px 20px;border-radius:100px;transition:.2s}
  a.back:hover{border-color:var(--blue)}
  .brand{margin-top:26px;font-size:.78rem;color:var(--faint);font-weight:600;letter-spacing:.1em}
</style>
</head>
<body>
  <div class="card">
    <div class="check"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6L9 17l-5-5"/></svg></div>
    <h1>제출이 완료되었습니다</h1>
    <p>입력해 주신 정보가 정상적으로 접수되었습니다.<br>담당자가 확인 후 홈페이지에 반영하겠습니다.</p>
    <div class="note"><b>📷 잊지 마세요!</b><br>시공 사진 · 회사 로고 · 실제 후기는 <b>카카오톡 또는 이메일</b>로 따로 보내주세요.</div>
    <a class="back" href="./">다시 입력하기</a>
    <div class="brand">배관119케어 · PLUMBING CARE</div>
  </div>
</body>
</html>
